[project]
name = "myagent"
version = "0.1.0"
description = "Local-first autonomous Telegram agent for macOS with Ollama"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "python-telegram-bot>=22.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "apscheduler>=3.10",
  "tenacity>=9.0",
  "orjson>=3.10",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "numpy>=2.1"
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
